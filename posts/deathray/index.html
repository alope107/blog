<!DOCTYPE html>
<html>
  <head>
    <link rel="stylesheet" href="./style.css">
  </head>
  <body>

<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 124 124" fill="none">
<defs>
  <circle id="wedge" cx="50" cy="50" r="10" stroke="yellow" 
    stroke-width="20" pathLength="360"
    stroke-dasharray="60 300" />
</defs>
  <g id="klaxon">
<circle cx="50" cy="50" r="20" fill="black"/>
<circle cx="50" cy="50" r="10" fill="yellow"/>

<use href="#wedge" transform="rotate(240, 50, 50)">
      <animateTransform
      attributeName="transform"
      type="rotate"
      from="240 50 50"
      to="600 50 50"
      dur="5s"
      begin="klaxon.mouseenter"
        end="klaxon.mouseleave"
        restart="whenNotActive"
      repeatCount="indefinite" />  
</use>
<use href="#wedge" transform="rotate(120, 50, 50)">
    <animateTransform
      attributeName="transform"
      type="rotate"
      from="120 50 50"
      to="480 50 50"
      dur="5s"
      begin="klaxon.mouseenter"
        end="klaxon.mouseleave"
        restart="whenNotActive"
      repeatCount="indefinite" />  
</use>
<use href="#wedge">
  <animateTransform
      attributeName="transform"
      type="rotate"
      from="0 50 50"
      to="360 50 50"
      dur="5s"
      begin="klaxon.mouseenter"
        end="klaxon.mouseleave"
        restart="whenNotActive"
      repeatCount="indefinite" />
</use>

  <circle cx="50" cy="50" r="5" fill="black"/>
        </g>
</svg>
    <div id="iconHolder">
      <img id="triangle" src="./images/triangle.png">
      <img id="trefoil" src="./images/trefoil.png">
    </div>
  </body>
</html>
